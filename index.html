<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D 5e</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .container > div {
            width: 48%;
        }

        label, input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        .section {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        .data-display {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Ficha de Personagem D&D 5e</h1>

    <div class="container">
        <div class="section">
            <h2>Dados Gerais</h2>
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Nome do Personagem">

            <label for="class">Classe:</label>
            <select id="class" onchange="toggleClassFeatures()">
                <option value="">Selecione a Classe</option>
                <option value="barbaro">Bárbaro</option>
                <option value="monge">Monge</option>
                <option value="mago">Mago</option>
                <option value="clerigo">Clérigo</option>
                <option value="ladino">Ladino</option>
                <option value="guerreiro">Guerreiro</option>
            </select>

            <label for="level">Nível:</label>
            <input type="number" id="level" placeholder="Nível do Personagem" oninput="updateSpellInfo()">

            <label for="race">Raça:</label>
            <input type="text" id="race" placeholder="Raça do Personagem">
        </div>

        <div class="section">
            <h2>Pontos de Vida</h2>
            <label for="max-hp">PV Máximo:</label>
            <input type="number" id="max-hp" placeholder="Pontos de Vida Máximos">

            <label for="current-hp">PV Atual:</label>
            <input type="number" id="current-hp" placeholder="Pontos de Vida Atuais">

            <label for="temp-hp">PV Temporário:</label>
            <input type="number" id="temp-hp" placeholder="Pontos de Vida Temporários">
        </div>
    </div>

    <div class="section">
        <h2>Atributos</h2>
        <label for="str">Força:</label>
        <input type="number" id="str" placeholder="Força" oninput="calculateModifiers()">
        
        <label for="dex">Destreza:</label>
        <input type="number" id="dex" placeholder="Destreza" oninput="calculateModifiers()">

        <label for="con">Constituição:</label>
        <input type="number" id="con" placeholder="Constituição" oninput="calculateModifiers()">

        <label for="int">Inteligência:</label>
        <input type="number" id="int" placeholder="Inteligência" oninput="calculateModifiers()">

        <label for="wis">Sabedoria:</label>
        <input type="number" id="wis" placeholder="Sabedoria" oninput="calculateModifiers()">

        <label for="cha">Carisma:</label>
        <input type="number" id="cha" placeholder="Carisma" oninput="calculateModifiers()">
    </div>

    <div class="section">
        <h2>Perícias</h2>
        <label for="acrobatics">Acrobacia (Dex):</label>
        <input type="number" id="acrobatics" placeholder="Valor de Acrobacia" readonly>

        <label for="animal-handling">Lidar com Animais (Wis):</label>
        <input type="number" id="animal-handling" placeholder="Valor de Lidar com Animais" readonly>

        <label for="arcana">Arcanismo (Int):</label>
        <input type="number" id="arcana" placeholder="Valor de Arcanismo" readonly>

        <label for="athletics">Atletismo (Str):</label>
        <input type="number" id="athletics" placeholder="Valor de Atletismo" readonly>

        <label for="deception">Enganação (Cha):</label>
        <input type="number" id="deception" placeholder="Valor de Enganação" readonly>

        <label for="history">História (Int):</label>
        <input type="number" id="history" placeholder="Valor de História" readonly>

        <label for="insight">Percepção (Wis):</label>
        <input type="number" id="insight" placeholder="Valor de Percepção" readonly>

        <label for="intimidation">Intimidação (Cha):</label>
        <input type="number" id="intimidation" placeholder="Valor de Intimidação" readonly>

        <label for="medicine">Medicina (Wis):</label>
        <input type="number" id="medicine" placeholder="Valor de Medicina" readonly>

        <label for="nature">Natureza (Int):</label>
        <input type="number" id="nature" placeholder="Valor de Natureza" readonly>

        <label for="perception">Percepção (Wis):</label>
        <input type="number" id="perception" placeholder="Valor de Percepção" readonly>

        <label for="performance">Performance (Cha):</label>
        <input type="number" id="performance" placeholder="Valor de Performance" readonly>

        <label for="persuasion">Persuasão (Cha):</label>
        <input type="number" id="persuasion" placeholder="Valor de Persuasão" readonly>

        <label for="religion">Religião (Int):</label>
        <input type="number" id="religion" placeholder="Valor de Religião" readonly>

        <label for="sleight-of-hand">Furtividade (Dex):</label>
        <input type="number" id="sleight-of-hand" placeholder="Valor de Furtividade" readonly>

        <label for="stealth">Furtividade (Dex):</label>
        <input type="number" id="stealth" placeholder="Valor de Furtividade" readonly>

        <label for="survival">Sobrevivência (Wis):</label>
        <input type="number" id="survival" placeholder="Valor de Sobrevivência" readonly>
    </div>

    <div class="section">
        <h2>Salvaguardas</h2>
        <label for="str-save">Força:</label>
        <input type="number" id="str-save" placeholder="Salvaguarda de Força" readonly>

        <label for="dex-save">Destreza:</label>
        <input type="number" id="dex-save" placeholder="Salvaguarda de Destreza" readonly>

        <label for="con-save">Constituição:</label>
        <input type="number" id="con-save" placeholder="Salvaguarda de Constituição" readonly>

        <label for="int-save">Inteligência:</label>
        <input type="number" id="int-save" placeholder="Salvaguarda de Inteligência" readonly>

        <label for="wis-save">Sabedoria:</label>
        <input type="number" id="wis-save" placeholder="Salvaguarda de Sabedoria" readonly>

        <label for="cha-save">Carisma:</label>
        <input type="number" id="cha-save" placeholder="Salvaguarda de Carisma" readonly>
    </div>

    <div class="section">
        <h2>Rolagem de Dados</h2>
        <label for="roll-dice">Escolha o Tipo de Dado (Exemplo: 2d6+1):</label>
        <input type="text" id="roll-dice" placeholder="Exemplo: 2d6+1">
        <button class="button" onclick="rollDice()">Rolagem</button>
        <div class="data-display" id="dice-result"></div>
    </div>

    <script>
        // Função para calcular os modificadores de atributos
        function calculateModifiers() {
            const attributes = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
            attributes.forEach(attr => {
                const value = document.getElementById(attr).value;
                const modifier = value ? Math.floor((parseInt(value) - 10) / 2) : 0;
                document.getElementById(`${attr}-mod`).value = modifier;
            });

            // Calculando as perícias com base no modificador
            updatePerks();
        }

        // Atualiza as perícias automaticamente
        function updatePerks() {
            const perks = {
                acrobatics: 'dex',
                animal-handling: 'wis',
                arcana: 'int',
                athletics: 'str',
                deception: 'cha',
                history: 'int',
                insight: 'wis',
                intimidation: 'cha',
                medicine: 'wis',
                nature: 'int',
                perception: 'wis',
                performance: 'cha',
                persuasion: 'cha',
                religion: 'int',
                sleight-of-hand: 'dex',
                stealth: 'dex',
                survival: 'wis'
            };
            for (let perk in perks) {
                const attribute = perks[perk];
                const modifier = document.getElementById(`${attribute}-mod`).value;
                document.getElementById(perk).value = modifier;
            }
        }

        // Função para rolar dados
        function rollDice() {
            const diceInput = document.getElementById('roll-dice').value;
            const regex = /^(\d+)d(\d+)([+-]?\d+)?$/;

            if (regex.test(diceInput)) {
                const match = diceInput.match(regex);
                const numDice = parseInt(match[1]);
                const sides = parseInt(match[2]);
                const modifier = match[3] ? parseInt(match[3]) : 0;

                let result = 0;
                let rolls = [];

                for (let i = 0; i < numDice; i++) {
                    const roll = Math.floor(Math.random() * sides) + 1;
                    rolls.push(roll);
                    result += roll;
                }

                result += modifier;

                // Exibindo os resultados
                document.getElementById('dice-result').innerHTML = `Rolagens: ${rolls.join(', ')}<br>Resultado Final: ${result}`;
            } else {
                document.getElementById('dice-result').innerHTML = "Formato inválido. Use algo como 2d6+1.";
            }
        }
    </script>

</body>
</html>
