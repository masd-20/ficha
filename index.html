<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ficha Online D&D 5e</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Ficha Online - D&D 5e</h1>
    </header>

    <section class="section">
      <label for="classe">Classe:</label>
      <select id="classe">
        <option value="">Selecione uma classe</option>
        <option value="Bardo">Bardo</option>
        <option value="Clérigo">Clérigo</option>
        <option value="Feiticeiro">Feiticeiro</option>
        <option value="Mago">Mago</option>
        <option value="Paladino">Paladino</option>
      </select>

      <label for="nivel">Nível:</label>
      <select id="nivel">
        <option value="">Selecione o nível</option>
        <!-- Níveis 1 a 20 -->
        <!-- Você pode copiar esta linha para adicionar até o nível 20 -->
        <!-- Exemplo até o 5 para simplificar -->
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </section>

    <section class="section" id="dados-da-classe">
      <h2>Características da Classe</h2>
      <div id="output">
        <p>Selecione uma classe e nível válidos.</p>
      </div>
    </section>

    <footer>
      <p>&copy; 2025 Ficha D&D Online</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
