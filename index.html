<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha de D&D 5e</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cinzel', serif;
      background: url('https://i.imgur.com/eBv0w6v.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f5f5dc;
    }
    .container {
      max-width: 960px;
      margin: auto;
      padding: 2rem;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      box-shadow: 0 0 20px #000;
    }
    h1, h2 {
      text-align: center;
      color: #ffd700;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      background: #222;
      color: #ffd700;
      border: 1px solid #555;
      border-radius: 4px;
    }
    .stat-block {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      text-align: center;
    }
    .section {
      margin-top: 2rem;
    }
    .dice-buttons button {
      background: #444;
      color: #ffd700;
      border: 1px solid #777;
      border-radius: 4px;
      padding: 0.5rem;
      margin: 0.25rem;
      cursor: pointer;
    }
    #roll-log {
      background: #111;
      padding: 1rem;
      height: 150px;
      overflow-y: scroll;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ficha de D&D 5e</h1>

    <div class="section">
      <h2>Personagem</h2>
      <input placeholder="Nome do Personagem" />
      <input placeholder="Raça" />
      <input placeholder="Classe e Nível" />
      <input placeholder="Alinhamento" />
    </div>

    <div class="section">
      <h2>Atributos</h2>
      <div class="stat-block">
        <input placeholder="Força" />
        <input placeholder="Destreza" />
        <input placeholder="Constituição" />
        <input placeholder="Inteligência" />
        <input placeholder="Sabedoria" />
        <input placeholder="Carisma" />
      </div>
    </div>

    <div class="section">
      <h2>Combate</h2>
      <input placeholder="Classe de Armadura (CA)" />
      <input placeholder="Iniciativa" />
      <input placeholder="Deslocamento" />
      <input placeholder="Pontos de Vida (PV)" />
    </div>

    <div class="section">
      <h2>Inventário</h2>
      <textarea rows="4" placeholder="Anote aqui seus itens..."></textarea>
    </div>

    <div class="section">
      <h2>Magias</h2>
      <textarea rows="4" placeholder="Magias conhecidas e espaços..."></textarea>
    </div>

    <div class="section">
      <h2>Rolagem de Dados</h2>
      <div class="dice-buttons">
        <button onclick="roll('d4')">D4</button>
        <button onclick="roll('d6')">D6</button>
        <button onclick="roll('d8')">D8</button>
        <button onclick="roll('d10')">D10</button>
        <button onclick="roll('d12')">D12</button>
        <button onclick="roll('d20')">D20</button>
        <button onclick="roll('d100')">D100</button>
      </div>
      <div id="roll-log"></div>
    </div>
  </div>

  <script>
    function roll(diceType) {
      const sides = parseInt(diceType.replace('d', ''));
      const result = Math.floor(Math.random() * sides) + 1;
      const log = document.getElementById('roll-log');
      const entry = document.createElement('div');
      entry.textContent = `Rolou ${diceType}: ${result}`;
      log.prepend(entry);
    }
  </script>
</body>
</html>
