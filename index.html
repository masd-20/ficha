<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
        }
        .row {
            display: flex;
            justify-content: space-between;
        }
        .row div {
            width: 48%;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ficha de Personagem D&D</h1>
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite o nome do personagem">

        <label for="classe">Classe</label>
        <input type="text" id="classe" placeholder="Digite a classe (Ex: Mago, Clérigo)">

        <label for="nivel">Nível</label>
        <input type="number" id="nivel" value="1" min="1">

        <label for="raca">Raça</label>
        <input type="text" id="raca" placeholder="Digite a raça">

        <div class="row">
            <div>
                <label for="forca">Força</label>
                <input type="number" id="forca" value="10">
            </div>
            <div>
                <label for="destreza">Destreza</label>
                <input type="number" id="destreza" value="10">
            </div>
        </div>
        <div class="row">
            <div>
                <label for="constituicao">Constituição</label>
                <input type="number" id="constituicao" value="10">
            </div>
            <div>
                <label for="inteligencia">Inteligência</label>
                <input type="number" id="inteligencia" value="10">
            </div>
        </div>
        <div class="row">
            <div>
                <label for="sabedoria">Sabedoria</label>
                <input type="number" id="sabedoria" value="10">
            </div>
            <div>
                <label for="carisma">Carisma</label>
                <input type="number" id="carisma" value="10">
            </div>
        </div>

        <label for="hp_maximo">HP Máximo</label>
        <input type="number" id="hp_maximo" value="20">
        
        <label for="hp_atual">HP Atual</label>
        <input type="number" id="hp_atual" value="20">
        
        <button class="btn" onclick="atualizarHP()">Atualizar HP</button>

        <label for="espacos_magia">Espaços de Magia (Máximo)</label>
        <input type="number" id="espacos_magia" value="0" readonly>

        <label for="magias_usadas">Magias Usadas</label>
        <input type="number" id="magias_usadas" value="0">

        <button class="btn" onclick="atualizarMagias()">Atualizar Magias</button>

        <h2>Resumo do Personagem</h2>
        <p><strong>Nome:</strong> <span id="res_nome">Não definido</span></p>
        <p><strong>Classe:</strong> <span id="res_classe">Não definida</span></p>
        <p><strong>Raça:</strong> <span id="res_raca">Não definida</span></p>
        <p><strong>HP:</strong> <span id="res_hp">Não definido</span></p>
        <p><strong>Espaços de Magia:</strong> <span id="res_magias">Não definido</span></p>
    </div>

    <script>
        function atualizarHP() {
            var hpMaximo = document.getElementById('hp_maximo').value;
            var hpAtual = document.getElementById('hp_atual').value;
            document.getElementById('res_hp').innerHTML = "HP Atual: " + hpAtual + " / " + hpMaximo;
        }

        function atualizarMagias() {
            var espacosMagia = calcularEspacosMagia();
            var magiasUsadas = document.getElementById('magias_usadas').value;
            var magiasRestantes = espacosMagia - magiasUsadas;
            document.getElementById('res_magias').innerHTML = "Espaços de Magia: " + magiasRestantes + " / " + espacosMagia;
            document.getElementById('espacos_magia').value = espacosMagia;
        }

        function calcularEspacosMagia() {
            var nivel = parseInt(document.getElementById('nivel').value);
            var classe = document.getElementById('classe').value.toLowerCase();
            var espacos = 0;

            if (classe === 'mago' || classe === 'clerigo') {
                // Exemplo simples para Mago e Clérigo
                if (nivel == 1) espacos = 2;
                else if (nivel == 2) espacos = 3;
                else if (nivel == 3) espacos = 4;
                else if (nivel == 4) espacos = 4;
                else if (nivel == 5) espacos = 4;
                // Expandir para mais níveis e classes
            }

            return espacos;
        }

        // Atualiza o resumo do personagem ao digitar informações
        document.getElementById('nome').addEventListener('input', function() {
            document.getElementById('res_nome').innerHTML = document.getElementById('nome').value;
        });
        document.getElementById('classe').addEventListener('input', function() {
            document.getElementById('res_classe').innerHTML = document.getElementById('classe').value;
        });
        document.getElementById('raca').addEventListener('input', function() {
            document.getElementById('res_raca').innerHTML = document.getElementById('raca').value;
        });
    </script>
</body>
</html>
