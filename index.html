<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ficha de Personagem</h1>
        </header>

        <section id="informacoes-basicas">
            <h2>Informações Básicas</h2>
            <div class="campo">
                <label for="nome">Nome do Personagem:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo">
                <label for="classe">Classe:</label>
                <select id="classe" name="classe" onchange="atualizarInfoClasse()">
                    <option value="">Selecione a Classe</option>
                    <option value="barbaro">Bárbaro</option>
                    <option value="bardo">Bardo</option>
                    <option value="clerigo">Clérigo</option>
                    <option value="druida">Druida</option>
                    <option value="guerreiro">Guerreiro</option>
                    <option value="monge">Monge</option>
                    <option value="paladino">Paladino</option>
                    <option value="patrulheiro">Patrulheiro</option>
                    <option value="ladino">Ladino</option>
                    <option value="feiticeiro">Feiticeiro</option>
                    <option value="mago">Mago</option>
                </select>
            </div>
            <div class="campo">
                <label for="nivel">Nível:</label>
                <input type="number" id="nivel" name="nivel" min="1" value="1" onchange="atualizarProficiencia()">
            </div>
            <div class="campo">
                <label for="raca">Raça:</label>
                <input type="text" id="raca" name="raca">
            </div>
            <div class="campo">
                <label for="tendencia">Tendência:</label>
                <input type="text" id="tendencia" name="tendencia">
            </div>
            <div class="campo">
                <label for="antecedente">Antecedente:</label>
                <input type="text" id="antecedente" name="antecedente">
            </div>
        </section>

        <section id="atributos">
            <h2>Atributos</h2>
            <div class="atributo">
                <label for="forca">Força:</label>
                <input type="number" id="forca" name="forca" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-forca"></span>
            </div>
            <div class="atributo">
                <label for="destreza">Destreza:</label>
                <input type="number" id="destreza" name="destreza" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-destreza"></span>
            </div>
            <div class="atributo">
                <label for="constituicao">Constituição:</label>
                <input type="number" id="constituicao" name="constituicao" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-constituicao"></span>
            </div>
            <div class="atributo">
                <label for="inteligencia">Inteligência:</label>
                <input type="number" id="inteligencia" name="inteligencia" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-inteligencia"></span>
            </div>
            <div class="atributo">
                <label for="sabedoria">Sabedoria:</label>
                <input type="number" id="sabedoria" name="sabedoria" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-sabedoria"></span>
            </div>
            <div class="atributo">
                <label for="carisma">Carisma:</label>
                <input type="number" id="carisma" name="carisma" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" id="mod-carisma"></span>
            </div>
        </section>

        <section id="pericias">
            <h2>Perícias</h2>
            <div class="pericia">
                <input type="checkbox" id="pericia-acrobacia" name="pericia-acrobacia" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-acrobacia">Acrobacia (DES)</label>
                <span class="valor-pericia" id="valor-pericia-acrobacia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-adestramento-animais" name="pericia-adestramento-animais" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-adestramento-animais">Adestramento de Animais (SAB)</label>
                <span class="valor-pericia" id="valor-pericia-adestramento-animais">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-arcanismo" name="pericia-arcanismo" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-arcanismo">Arcanismo (INT)</label>
                <span class="valor-pericia" id="valor-pericia-arcanismo">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-atletismo" name="pericia-atletismo" data-atributo="forca" onchange="atualizarPericias()">
                <label for="pericia-atletismo">Atletismo (FOR)</label>
                <span class="valor-pericia" id="valor-pericia-atletismo">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-atuacao" name="pericia-atuacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-atuacao">Atuação (CAR)</label>
                <span class="valor-pericia" id="valor-pericia-atuacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-enganacao" name="pericia-enganacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-enganacao">Enganação (CAR)</label>
                <span class="valor-pericia" id="valor-pericia-enganacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-furtividade" name="pericia-furtividade" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-furtividade">Furtividade (DES)</label>
                <span class="valor-pericia" id="valor-pericia-furtividade">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-historia" name="pericia-historia" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-historia">História (INT)</label>
                <span class="valor-pericia" id="valor-pericia-historia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-intimidacao" name="pericia-intimidacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-intimidacao">Intimidação (CAR)</label>
                <span class="valor-pericia" id="valor-pericia-intimidacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-intuicao" name="pericia-intuicao" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-intuicao">Intuição (SAB)</label>
                <span class="valor-pericia" id="valor-pericia-intuicao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-investigacao" name="pericia-investigacao" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-investigacao">Investigação (INT)</label>
                <span class="valor-pericia" id="valor-pericia-investigacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-medicina" name="pericia-medicina" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-medicina">Medicina (SAB)</label>
                <span class="valor-pericia" id="valor-pericia-medicina">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-natureza" name="pericia-natureza" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-natureza">Natureza (INT)</label>
                <span class="valor-pericia" id="valor-pericia-natureza">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-percepcao" name="pericia-percepcao" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-percepcao">Percepção (SAB)</label>
                <span class="valor-pericia" id="valor-pericia-percepcao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-persuasao" name="pericia-persuasao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-persuasao">Persuasão (CAR)</label>
                <span class="valor-pericia" id="valor-pericia-persuasao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-prestidigitacao" name="pericia-prestidigitacao" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-prestidigitacao">Prestidigitação (DES)</label>
                <span class="valor-pericia" id="valor-pericia-prestidigitacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-religiao" name="pericia-religiao" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-religiao">Religião (INT)</label>
                <span class="valor-pericia" id="valor-pericia-religiao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-sobrevivencia" name="pericia-sobrevivencia" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-sobrevivencia">Sobrevivência (SAB)</label>
                <span class="valor-pericia" id="valor-pericia-sobrevivencia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-sigilo" name="pericia-sigilo" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-sigilo">Sigilo (DES)</label>
                <span class="valor-pericia" id="valor-pericia-sigilo">0</span>
            </div>
        </section>

        <section id="habilidades">
            <h2>Habilidades de Classe e Recursos</h2>
            <div id="recursos-barbaro" style="display: none;">
                <h3>Fúria</h3>
                <div class="campo-duplo">
                    <label for="furia-atual">Fúria Atual:</label>
                    <input type="number" id="furia-atual" name="furia-atual" min="0" value="0">
                    <label for="furia-max">Fúria Máxima:</label>
                    <input type="number" id="furia-max" name="furia-max" min="0" value="0" readonly>
                </div>
                <button onclick="usarRecurso('furia')">Usar Fúria</button>
                <button onclick="restaurarRecursos('furia', 'longo')">Descanso Longo</button>
            </div>

            <div id="recursos-bardo" style="display: none;">
                </div>

            <div id="recursos-clerigo" style="display: none;">
                <h3>Canalizar Divindade</h3>
                <div class="campo-duplo">
                    <label for="canalizar-divindade-atual">Atual:</label>
                    <input type="number" id="canalizar-divindade-atual" name="canalizar-divindade-atual" min="0" value="0">
                    <label for="canalizar-divindade-max">Máximo:</label>
                    <input type="number" id="canalizar-divindade-max" name="canalizar-divindade-max" min="0" value="0" readonly>
                </div>
                <button onclick="usarRecurso('canalizar-divindade')">Usar Canalizar Divindade</button>
                <button onclick="restaurarRecursos('canalizar-divindade', 'curto')">Descanso Curto</button>
                <button onclick="restaurarRecursos('canalizar-divindade', 'longo')">Descanso Longo</button>
            </div>

            <div id="recursos-druida" style="display: none;">
                </div>

            <div id="recursos-guerreiro" style="display: none;">
                <h3>Surto de Ação</h3>
                <div class="campo-duplo">
                    <label for="surto-acao-atual">Atual:</label>
                    <input type="number" id="surto-acao-atual" name="surto-acao-atual" min="0" value="0">
                    <label for="surto-acao-max">Máximo:</label>
                    <input type="number" id="surto-acao-max" name="surto-acao-max" min="0" value="0" readonly>
                </div>
                <button onclick="usarRecurso('surto-acao')">Usar Surto de Ação</button>
                <button onclick="restaurarRecursos('surto-acao', 'curto')">Descanso Curto</button>
                <button onclick="restaurarRecursos('surto-acao', 'longo')">Descanso Longo</button>
            </div>

            <div id="recursos-monge" style="display: none;">
                <h3>Ki</h3>
                <div class="campo-duplo">
                    <label for="ki-atual">Ki Atual:</label>
                    <input type="number" id="ki-atual" name="ki-atual" min="0" value="0">
                    <label for="ki-max">Máximo de Ki:</label>
                    <input type="number" id="ki-max" name="ki-max" min="0" value="0" readonly>
                </div>
                <button onclick="usarRecurso('ki')">Usar Ki</button>
                <button onclick="restaurarRecursos('ki', 'longo')">Descanso Longo</button>
            </div>

            <div id="recursos-paladino" style="display: none;">
                <h3>Canalizar Divindade</h3>
                <div class="campo-duplo">
                    <label for="canalizar-divindade-paladino-atual">Atual:</label>
                    <input type="number" id="canalizar-divindade-paladino-atual" name="canalizar-divindade-paladino-atual
