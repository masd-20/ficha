<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ficha de Personagem</h1>
        </header>

        <section id="informacoes-basicas">
            <h2>Informações Básicas</h2>
            <div class="campo">
                <label for="nome">Nome do Personagem:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo">
                <label for="classe">Classe:</label>
                <select id="classe" name="classe">
                    <option value="">Selecione a Classe</option>
                </select>
            </div>
            <div class="campo">
                <label for="nivel">Nível:</label>
                <input type="number" id="nivel" name="nivel" min="1" value="1">
            </div>
            <div class="campo">
                <label for="raca">Raça:</label>
                <input type="text" id="raca" name="raca">
            </div>
            <div class="campo">
                <label for="tendencia">Tendência:</label>
                <input type="text" id="tendencia" name="tendencia">
            </div>
            <div class="campo">
                <label for="antecedente">Antecedente:</label>
                <input type="text" id="antecedente" name="antecedente">
            </div>
        </section>

        <section id="atributos">
            <h2>Atributos</h2>
            <div class="atributo">
                <label for="forca">Força:</label>
                <input type="number" id="forca" name="forca" min="1" value="10">
                <span class="modificador" id="mod-forca"></span>
            </div>
            <div class="atributo">
                <label for="destreza">Destreza:</label>
                <input type="number" id="destreza" name="destreza" min="1" value="10">
                <span class="modificador" id="mod-destreza"></span>
            </div>
            <div class="atributo">
                <label for="constituicao">Constituição:</label>
                <input type="number" id="constituicao" name="constituicao" min="1" value="10">
                <span class="modificador" id="mod-constituicao"></span>
            </div>
            <div class="atributo">
                <label for="inteligencia">Inteligência:</label>
                <input type="number" id="inteligencia" name="inteligencia" min="1" value="10">
                <span class="modificador" id="mod-inteligencia"></span>
            </div>
            <div class="atributo">
                <label for="sabedoria">Sabedoria:</label>
                <input type="number" id="sabedoria" name="sabedoria" min="1" value="10">
                <span class="modificador" id="mod-sabedoria"></span>
            </div>
            <div class="atributo">
                <label for="carisma">Carisma:</label>
                <input type="number" id="carisma" name="carisma" min="1" value="10">
                <span class="modificador" id="mod-carisma"></span>
            </div>
        </section>

        <section id="pericias">
            <h2>Perícias</h2>
            </section>

        <section id="habilidades">
            <h2>Habilidades de Classe e Recursos</h2>
            </section>

        <section id="magias">
            <h2>Magias</h2>
            </section>

        <section id="equipamentos">
            <h2>Equipamentos</h2>
            </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
