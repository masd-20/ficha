<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D 5e</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .container > div {
            width: 48%;
        }

        label, input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        .section {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        .data-display {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Ficha de Personagem D&D 5e</h1>

    <div class="container">
        <div class="section">
            <h2>Dados Gerais</h2>
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Nome do Personagem">

            <label for="class">Classe:</label>
            <select id="class" onchange="toggleSpells()">
                <option value="">Selecione a Classe</option>
                <option value="conjurador">Conjurador</option>
                <option value="nao-conjurador">Não Conjurador</option>
            </select>

            <label for="level">Nível:</label>
            <input type="number" id="level" placeholder="Nível do Personagem">

            <label for="race">Raça:</label>
            <input type="text" id="race" placeholder="Raça do Personagem">
        </div>

        <div class="section">
            <h2>Pontos de Vida</h2>
            <label for="max-hp">PV Máximo:</label>
            <input type="number" id="max-hp" placeholder="Pontos de Vida Máximos">

            <label for="current-hp">PV Atual:</label>
            <input type="number" id="current-hp" placeholder="Pontos de Vida Atuais">

            <label for="temp-hp">PV Temporário:</label>
            <input type="number" id="temp-hp" placeholder="Pontos de Vida Temporários">
        </div>
    </div>

    <div class="section">
        <h2>Perícias</h2>
        <label for="acrobatics">Acrobacia (Dex):</label>
        <input type="number" id="acrobatics" placeholder="Valor de Acrobacia">

        <label for="animal-handling">Lidar com Animais (Wis):</label>
        <input type="number" id="animal-handling" placeholder="Valor de Lidar com Animais">

        <label for="arcana">Arcanismo (Int):</label>
        <input type="number" id="arcana" placeholder="Valor de Arcanismo">

        <label for="athletics">Atletismo (Str):</label>
        <input type="number" id="athletics" placeholder="Valor de Atletismo">

        <label for="deception">Enganação (Cha):</label>
        <input type="number" id="deception" placeholder="Valor de Enganação">

        <label for="history">História (Int):</label>
        <input type="number" id="history" placeholder="Valor de História">

        <label for="insight">Percepção (Wis):</label>
        <input type="number" id="insight" placeholder="Valor de Percepção">

        <label for="intimidation">Intimidação (Cha):</label>
        <input type="number" id="intimidation" placeholder="Valor de Intimidação">

        <label for="medicine">Medicina (Wis):</label>
        <input type="number" id="medicine" placeholder="Valor de Medicina">

        <label for="nature">Natureza (Int):</label>
        <input type="number" id="nature" placeholder="Valor de Natureza">

        <label for="perception">Percepção (Wis):</label>
        <input type="number" id="perception" placeholder="Valor de Percepção">

        <label for="performance">Performance (Cha):</label>
        <input type="number" id="performance" placeholder="Valor de Performance">

        <label for="persuasion">Persuasão (Cha):</label>
        <input type="number" id="persuasion" placeholder="Valor de Persuasão">

        <label for="religion">Religião (Int):</label>
        <input type="number" id="religion" placeholder="Valor de Religião">

        <label for="sleight-of-hand">Furtividade (Dex):</label>
        <input type="number" id="sleight-of-hand" placeholder="Valor de Furtividade">

        <label for="stealth">Furtividade (Dex):</label>
        <input type="number" id="stealth" placeholder="Valor de Furtividade">

        <label for="survival">Sobrevivência (Wis):</label>
        <input type="number" id="survival" placeholder="Valor de Sobrevivência">
    </div>

    <div class="section">
        <h2>Salvaguardas</h2>
        <label for="str-save">Força:</label>
        <input type="number" id="str-save" placeholder="Modificador de Salvaguarda de Força">

        <label for="dex-save">Destreza:</label>
        <input type="number" id="dex-save" placeholder="Modificador de Salvaguarda de Destreza">

        <label for="con-save">Constituição:</label>
        <input type="number" id="con-save" placeholder="Modificador de Salvaguarda de Constituição">

        <label for="int-save">Inteligência:</label>
        <input type="number" id="int-save" placeholder="Modificador de Salvaguarda de Inteligência">

        <label for="wis-save">Sabedoria:</label>
        <input type="number" id="wis-save" placeholder="Modificador de Salvaguarda de Sabedoria">

        <label for="cha-save">Carisma:</label>
        <input type="number" id="cha-save" placeholder="Modificador de Salvaguarda de Carisma">
    </div>

    <div class="section hidden" id="spell-section">
        <h2>Magias</h2>
        <label for="spells">Magias Conhecidas:</label>
        <input type="text" id="spells" placeholder="Digite as magias do personagem">
    </div>

    <div class="section">
        <button class="button" onclick="rollDice(20)">Rolar d20</button>
        <button class="button" onclick="rollDice(6)">Rolar d6</button>
        <div class="data-display" id="roll-result"></div>
    </div>

    <script>
        // Função para alternar a visibilidade da seção de magias com base na classe
        function toggleSpells() {
            var classSelect = document.getElementById("class").value;
            var spellSection = document.getElementById("spell-section");

            if (classSelect === "conjurador") {
                spellSection.classList.remove("hidden");
            } else {
                spellSection.classList.add("hidden");
            }
        }

        // Função para rolar dados
        function rollDice(sides) {
            var roll = Math.floor(Math.random() * sides) + 1;
            document.getElementById("roll-result").innerText = "Resultado: " + roll;
        }
    </script>

</body>
</html>
