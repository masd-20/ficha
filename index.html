<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grimorio-container">
        <header>
            <h1>Ficha de Personagem</h1>
        </header>

        <section id="informacoes-basicas">
            <h2>Informações Básicas</h2>
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo">
                <label for="classe">Classe:</label>
                <select id="classe" name="classe" onchange="atualizarFicha()">
                    <option value="">Selecione</option>
                    <option value="barbaro">Bárbaro</option>
                    <option value="bardo">Bardo</option>
                    <option value="clerigo">Clérigo</option>
                    <option value="druida">Druida</option>
                    <option value="guerreiro">Guerreiro</option>
                    <option value="monge">Monge</option>
                    <option value="paladino">Paladino</option>
                    <option value="patrulheiro">Patrulheiro</option>
                    <option value="ladino">Ladino</option>
                    <option value="feiticeiro">Feiticeiro</option>
                    <option value="mago">Mago</option>
                </select>
            </div>
            <div class="campo">
                <label for="nivel">Nível:</label>
                <input type="number" id="nivel" name="nivel" min="1" value="1" onchange="atualizarFicha()">
            </div>
            <div class="campo">
                <label for="raca">Raça:</label>
                <input type="text" id="raca" name="raca">
            </div>
            <div class="campo">
                <label for="tendencia">Tendência:</label>
                <input type="text" id="tendencia" name="tendencia">
            </div>
            <div class="campo">
                <label for="antecedente">Antecedente:</label>
                <input type="text" id="antecedente" name="antecedente">
            </div>
        </section>

        <section id="atributos">
            <h2>Atributos</h2>
            <div class="atributo">
                <label for="forca">Força:</label>
                <input type="number" id="forca" name="forca" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="forca"></span>
            </div>
            <div class="atributo">
                <label for="destreza">Destreza:</label>
                <input type="number" id="destreza" name="destreza" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="destreza"></span>
            </div>
            <div class="atributo">
                <label for="constituicao">Constituição:</label>
                <input type="number" id="constituicao" name="constituicao" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="constituicao"></span>
            </div>
            <div class="atributo">
                <label for="inteligencia">Inteligência:</label>
                <input type="number" id="inteligencia" name="inteligencia" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="inteligencia"></span>
            </div>
            <div class="atributo">
                <label for="sabedoria">Sabedoria:</label>
                <input type="number" id="sabedoria" name="sabedoria" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="sabedoria"></span>
            </div>
            <div class="atributo">
                <label for="carisma">Carisma:</label>
                <input type="number" id="carisma" name="carisma" min="1" value="10" onchange="atualizarModificadores()">
                <span class="modificador" data-atributo="carisma"></span>
            </div>
        </section>

        <section id="defesa">
            <h2>Defesa</h2>
            <div class="campo-inline">
                <label for="ca-base">CA Base:</label>
                <input type="number" id="ca-base" name="ca-base" value="10" onchange="atualizarCA()">
                <label for="bonus-ca"> + Bônus:</label>
                <input type="number" id="bonus-ca" name="bonus-ca" value="0" size="2" onchange="atualizarCA()">
                <label for="ca-total"> = CA Total:</label>
                <span id="ca-total">10</span>
            </div>
        </section>

        <section id="pontos-vida">
            <h2>Pontos de Vida</h2>
            <div class="campo-inline">
                <label for="hp-atual">HP Atual:</label>
                <button type="button" onclick="alterarHP(-1)">-</button>
                <input type="number" id="hp-atual" name="hp-atual" value="1" onchange="validarHP()">
                <button type="button" onclick="alterarHP(1)">+</button>
            </div>
            <div class="campo">
                <label for="hp-max">HP Máximo:</label>
                <input type="number" id="hp-max" name="hp-max" value="1" onchange="validarHP()">
            </div>
            <div class="campo">
                <label for="hp-temp">HP Temporário:</label>
                <input type="number" id="hp-temp" name="hp-temp" value="0">
            </div>
        </section>

        <section id="pericias">
            <h2>Perícias</h2>
            <div class="pericia">
                <input type="checkbox" id="pericia-acrobacia" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-acrobacia">Acrobacia (DES)</label>
                <span class="valor-pericia" data-pericia="acrobacia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-adestramento-animais" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-adestramento-animais">Adestramento de Animais (SAB)</label>
                <span class="valor-pericia" data-pericia="adestramento-animais">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-arcanismo" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-arcanismo">Arcanismo (INT)</label>
                <span class="valor-pericia" data-pericia="arcanismo">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-atletismo" data-atributo="forca" onchange="atualizarPericias()">
                <label for="pericia-atletismo">Atletismo (FOR)</label>
                <span class="valor-pericia" data-pericia="atletismo">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-atuacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-atuacao">Atuação (CAR)</label>
                <span class="valor-pericia" data-pericia="atuacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-enganacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-enganacao">Enganação (CAR)</label>
                <span class="valor-pericia" data-pericia="enganacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-furtividade" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-furtividade">Furtividade (DES)</label>
                <span class="valor-pericia" data-pericia="furtividade">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-historia" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-historia">História (INT)</label>
                <span class="valor-pericia" data-pericia="historia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-intimidacao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-intimidacao">Intimidação (CAR)</label>
                <span class="valor-pericia" data-pericia="intimidacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-intuicao" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-intuicao">Intuição (SAB)</label>
                <span class="valor-pericia" data-pericia="intuicao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-investigacao" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-investigacao">Investigação (INT)</label>
                <span class="valor-pericia" data-pericia="investigacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-medicina" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-medicina">Medicina (SAB)</label>
                <span class="valor-pericia" data-pericia="medicina">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-natureza" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-natureza">Natureza (INT)</label>
                <span class="valor-pericia" data-pericia="natureza">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-percepcao" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-percepcao">Percepção (SAB)</label>
                <span class="valor-pericia" data-pericia="percepcao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-persuasao" data-atributo="carisma" onchange="atualizarPericias()">
                <label for="pericia-persuasao">Persuasão (CAR)</label>
                <span class="valor-pericia" data-pericia="persuasao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-prestidigitacao" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-prestidigitacao">Prestidigitação (DES)</label>
                <span class="valor-pericia" data-pericia="prestidigitacao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-religiao" data-atributo="inteligencia" onchange="atualizarPericias()">
                <label for="pericia-religiao">Religião (INT)</label>
                <span class="valor-pericia" data-pericia="religiao">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-sobrevivencia" data-atributo="sabedoria" onchange="atualizarPericias()">
                <label for="pericia-sobrevivencia">Sobrevivência (SAB)</label>
                <span class="valor-pericia" data-pericia="sobrevivencia">0</span>
            </div>
            <div class="pericia">
                <input type="checkbox" id="pericia-sigilo" data-atributo="destreza" onchange="atualizarPericias()">
                <label for="pericia-sigilo">Sigilo (DES)</label>
                <span class="valor-pericia" data-pericia="sigilo">0</span>
            </div>
        </section>

        <section id="habilidades-e-magias">
            <h2>Habilidades de Classe, Magias e Consumíveis</h2>
            <div id="habilidades">
                </div>
            <div id="magias" style="display: none;">
                <h3>Magias</h3>
                <div id="info-conjurador">
                    <p>Atributo de Conjuração: <span id="atributo-conjuração"></span></p>
                    <p>CD de Magia: <span id="cd-magia-base"></span></p>
                    <p>Modificador de Ataque Mágico: <span id="mod-ataque-magia-base"></span> + <input type="number" id="bonus-ataque-magia" name="bonus-ataque-magia" value="0" size="2" onchange="atualizarModAtaqueMagia()"> Bônus</p>
                </div>
                <div id="magias-por-circulo">
                    <h3>Magias por Círculo</h3>
                    </div>
            </div>
            <div id="consumiveis">
                <h3>Consumíveis</h3>
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
